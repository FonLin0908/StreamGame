<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamGame | 核心成員管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .badge-role { font-size: 0.75rem; font-weight: bold; }
        .table-responsive { max-height: 600px; overflow-y: auto; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-house-door me-2"></i>回首頁</a>
        <span class="navbar-text text-white">Supabase 雲端資料庫模式</span>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card main-card p-4">
                <h5 id="formTitle" class="fw-bold mb-3">新增成員紀錄</h5>
                <input type="hidden" id="editUserId">

                <div class="mb-3">
                    <label class="form-label small fw-bold">基本名稱</label>
                    <input type="text" id="userName" class="form-control" placeholder="輸入名稱">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Twitch ID</label>
                    <input type="text" id="twitchID" class="form-control" placeholder="例如: streamer123">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Discord ID</label>
                    <input type="text" id="discordID" class="form-control" placeholder="例如: User#1234">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">分配權限</label>
                    <select id="userRole" class="form-select">
                        <option value="USER">普通使用者 (User)</option>
                        <option value="VIP">重要嘉賓 (VIP)</option>
                        <option value="ADMIN">管理員 (Admin)</option>
                        <option value="MOD">房管 (Mod)</option>
                    </select>
                </div>

                <div id="addBtnGroup">
                    <button onclick="saveUser()" class="btn btn-primary w-100 fw-bold">確認存入 Supabase</button>
                </div>
                <div id="editBtnGroup" class="d-none">
                    <button onclick="updateUser()" class="btn btn-warning w-100 fw-bold mb-2">更新資料</button>
                    <button onclick="cancelEdit()" class="btn btn-outline-secondary w-100 btn-sm">取消編輯</button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card main-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">成員資料清單</h5>
                    <button onclick="loadUsers()" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> 刷新</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>名稱</th>
                            <th>Twitch</th>
                            <th>Discord</th>
                            <th>權限</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="userTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 獲取所有資料
    function loadUsers() {
        fetch('/api/all')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('userTable');
                tbody.innerHTML = '';
                data.forEach(user => {
                    const roleClass = user.role === 'ADMIN' ? 'bg-danger' :
                                    user.role === 'VIP' ? 'bg-warning text-dark' : 'bg-info';

                    tbody.innerHTML += `
                        <tr>
                            <td><span class="text-muted">#${user.id}</span></td>
                            <td class="fw-bold text-primary">${user.name}</td>
                            <td><small>${user.twitchID || 'N/A'}</small></td>
                            <td><small>${user.discordID || 'N/A'}</small></td>
                            <td><span class="badge badge-role ${roleClass}">${user.role}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1"
                                        onclick='startEdit(${JSON.stringify(user)})'>
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    // 新增資料
    function saveUser() {
        const params = new URLSearchParams({
            name: document.getElementById('userName').value,
            twitchID: document.getElementById('twitchID').value,
            discordID: document.getElementById('discordID').value,
            role: document.getElementById('userRole').value
        });

        if (!params.get('name')) return alert("名稱為必填項目！");

        fetch(`/api/save?${params.toString()}`)
            .then(res => res.text())
            .then(data => {
                alert(data);
                clearForm();
                loadUsers();
            });
    }

    // 啟動編輯模式
    function startEdit(user) {
        // 切換標題與顯示 ID
        document.getElementById('formTitle').innerText = "編輯成員 #" + user.id;
        document.getElementById('editUserId').value = user.id;

        // 填入現有資料
        document.getElementById('userName').value = user.name;
        document.getElementById('twitchID').value = user.twitchID;
        document.getElementById('discordID').value = user.discordID;
        document.getElementById('userRole').value = user.role;

        // 切換按鈕組
        document.getElementById('addBtnGroup').classList.add('d-none');
        document.getElementById('editBtnGroup').classList.remove('d-none');

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 執行更新
    function updateUser() {
        const id = document.getElementById('editUserId').value;
        const params = new URLSearchParams({
            id: id,
            name: document.getElementById('userName').value,
            twitchID: document.getElementById('twitchID').value,
            discordID: document.getElementById('discordID').value,
            role: document.getElementById('userRole').value
        });

        fetch(`/api/update?${params.toString()}`)
            .then(res => res.text())
            .then(data => {
                alert(data);
                cancelEdit();
                loadUsers();
            });
    }

    // 刪除資料
    function deleteUser(id) {
        if (!confirm("確定要刪除此筆成員資料嗎？")) return;
        fetch(`/api/delete?id=${id}`)
            .then(res => res.text())
            .then(data => {
                alert(data);
                loadUsers();
            });
    }

    // 取消編輯模式
    function cancelEdit() {
        document.getElementById('formTitle').innerText = "新增成員紀錄";
        clearForm();
        document.getElementById('addBtnGroup').classList.remove('d-none');
        document.getElementById('editBtnGroup').classList.add('d-none');
    }

    // 清空表單
    function clearForm() {
        document.getElementById('editUserId').value = '';
        document.getElementById('userName').value = '';
        document.getElementById('twitchID').value = '';
        document.getElementById('discordID').value = '';
        document.getElementById('userRole').value = 'USER';
    }

    window.onload = loadUsers;
</script>
<div class="card main-card p-4 mt-4" style="background-color: #f8f0ff;">
    <h6 class="fw-bold twitch-purple"><i class="bi bi-chat-dots-fill"></i> 遠端操控機器人</h6>
    <div class="input-group">
        <input type="text" id="botMsg" class="form-control form-control-sm" placeholder="輸入想說的話...">
        <button class="btn btn-sm btn-primary" onclick="sendBotMsg()">發送</button>
    </div>
</div>

<script>
    function sendBotMsg() {
        const msg = document.getElementById('botMsg').value;
        if(!msg) return;
        fetch(`/api/twitch/send?msg=${encodeURIComponent(msg)}`)
            .then(res => res.text())
            .then(data => {
                alert(data);
                document.getElementById('botMsg').value = '';
            });
    }
</script>

</body>
</html>
